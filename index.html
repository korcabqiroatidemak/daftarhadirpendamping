<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Daftar Hadir Pendamping</title>
    <style>
        /* --- GAYA KONTROL PANEL (MENIRU SKRIP SEBELUMNYA) --- */
        body {
            font-family: Arial, sans-serif;
            background-color: #525659; /* Background Gelap */
            margin: 0; padding: 0; 
            text-align: center;
        }

        .control-panel {
            background: #fff; width: 215mm; margin: 20px auto;
            padding: 15px 20px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,.3); text-align: left;
            box-sizing: border-box;
        }

        #shift-container {
            border: 1px solid #ddd; padding: 8px;
            background: #fafafa; margin-bottom: 12px; 
            display: flex; flex-flow: column wrap; 
            height: 85px; overflow-x: auto; overflow-y: hidden;     
            gap: 0 15px;            
        }
        #shift-container::-webkit-scrollbar { height: 6px; }
        #shift-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        
        .cb-item { 
            font-size: 12px; cursor: pointer; display: flex; 
            align-items: center; gap: 6px; height: 26px;            
            width: 190px; flex-shrink: 0; white-space: nowrap;
        }

        .btn-generate { 
            width: 100%; padding: 10px; font-weight: bold; 
            background: #28a745; color: #fff; border: none; 
            cursor: pointer; border-radius: 4px; text-transform: uppercase; 
        }

        /* --- GAYA KERTAS A4 (OUTPUT) --- */
        @page { size: A4; margin: 10mm; }
        
        .page-container {
            background: white; width: 210mm; min-height: 297mm;
            margin: 0 auto 30px auto; padding: 15mm; box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0,0,0,0.5); text-align: left;
            position: relative;
        }

        /* Kop Surat */
        .kop-header { display: flex; align-items: center; border-bottom: 3px double black; padding-bottom: 10px; margin-bottom: 20px; font-family: 'Times New Roman', serif; }
        .logo { width: 80px; height: 80px; margin-right: 15px; }
        .logo img { width: 100%; height: auto; }
        .kop-text { text-align: center; flex: 1; }
        .kop-text h2 { margin: 0; font-size: 18pt; font-weight: bold; color: #006400; }
        .kop-text h3 { margin: 0; font-size: 14pt; font-weight: bold; }
        .kop-text p { margin: 5px 0 0; font-size: 10pt; font-style: italic; }

        /* Judul Dokumen */
        .doc-title { text-align: center; margin-bottom: 20px; font-family: 'Times New Roman', serif; }
        .doc-title h1 { margin: 0; font-size: 16pt; text-decoration: underline; font-weight: bold; }
        .doc-title p { margin: 5px 0 0; font-size: 12pt; cursor: text; border: 1px dashed #ccc; display: inline-block; padding: 2px 5px; }
        .doc-title p:focus { border-color: blue; outline: none; }

        /* Tabel Shift */
        .shift-block { margin-bottom: 30px; page-break-inside: avoid; font-family: 'Times New Roman', serif; }
        .shift-header { font-weight: bold; font-size: 12pt; margin-bottom: 5px; border-bottom: 1px solid #000; display: inline-block; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 11pt; }
        th, td { border: 1px solid black; padding: 4px; vertical-align: middle; }
        th { background-color: #f0f0f0; text-align: center; font-weight: bold; height: 30px; }
        
        .col-no { width: 30px; text-align: center; }
        .col-jml { width: 60px; text-align: center; }
        .col-pendamping { height: 50px; position: relative; vertical-align: top; }
        .col-ttd { width: 60px; }
        
        .pendamping-placeholder { color: #ccc; font-size: 10pt; }
        .pendamping-footer { position: absolute; bottom: 2px; left: 5px; font-size: 9pt; color: #555; width: 95%; border-top: 1px dotted #ccc; }

        .footer-note { font-family: 'Times New Roman', serif; margin-top: 20px; font-size: 10pt; font-style: italic; border-top: 1px solid black; padding-top: 5px; }

        @media print {
            body { background: none; }
            .control-panel { display: none !important; }
            .page-container { margin: 0; box-shadow: none; width: 100%; height: auto; page-break-after: always; }
            .doc-title p { border: none; } /* Hilangkan garis edit saat print */
            th { background-color: #f0f0f0 !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body>

<div class="control-panel">
    <h3 style="margin: 0 0 5px 0; font-size: 18px;">DAFTAR HADIR PENDAMPING</h3>
    <p style="font-size: 11px; color: #666; margin: 0 0 10px 0;">Pilih Gelombang & Shift (Data direkap otomatis per Lembaga):</p>
    
    <div id="shift-container">Sedang mengambil data dari Spreadsheet...</div>
    
    <button class="btn-generate" onclick="generate()">GENERATE DAFTAR HADIR</button>
</div>

<div id="main-output"></div>

<script>
    // --- KONFIGURASI SUMBER DATA ---
    const SHEET_ID = '1eIcvIgCLWG3F9jQdsw5XN9llOsK2PoYWKUg1qaQJyyA';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Biodata Cek`;
    const LOGO_FILENAME = "QIRAATI.png";
    
    let rawData = [];
    let shiftKeys = [];

    // 1. LOAD DATA SAAT WEB DIBUKA
    window.onload = async () => {
        try {
            const response = await fetch(SHEET_URL);
            const csvText = await response.text();
            processData(csvText);
        } catch (e) {
            document.getElementById('shift-container').innerHTML = 
                `<span style="color:red">Gagal memuat data. Pastikan koneksi internet lancar.</span>`;
            console.error(e);
        }
    };

    // 2. OLAH DATA CSV
    function processData(csv) {
        const rows = csv.trim().split('\n');
        // Bersihkan header dari tanda kutip
        const headers = rows[0].split(',').map(h => h.replace(/"/g, '').trim().toUpperCase());
        
        rawData = [];
        let uniqueShifts = new Set();

        for (let i = 1; i < rows.length; i++) {
            // Regex untuk split CSV yang menangani koma dalam tanda kutip
            const cols = rows[i].match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
            
            let p = {};
            cols.forEach((v, j) => {
                p[headers[j]] = v ? v.replace(/"/g, '').trim() : '';
            });

            // Ambil Key Penting
            const gel = p['GELOMBANG'] || '?';
            const sft = p['SHIFT'] || '?';
            const lembaga = p['ASAL LEMBAGA / TPQ'] || 'UMUM';
            
            // Simpan data mentah
            rawData.push({
                key: `${gel}-${sft}`,
                gelombang: gel,
                shift: sft,
                lembaga: lembaga
            });

            if(gel !== '?' && sft !== '?') uniqueShifts.add(`${gel}-${sft}`);
        }

        // Render Checkbox
        renderCheckboxes(Array.from(uniqueShifts).sort());
    }

    // 3. RENDER CHECKBOX DI PANEL KONTROL
    function renderCheckboxes(keys) {
        const container = document.getElementById('shift-container');
        container.innerHTML = '';
        
        keys.forEach(k => {
            const parts = k.split('-');
            const label = document.createElement('label');
            label.className = 'cb-item';
            // Hitung total peserta di shift ini untuk info
            const count = rawData.filter(d => d.key === k).length;
            
            label.innerHTML = `<input type="checkbox" name="chk-shift" value="${k}"> Gel ${parts[0]} - Sft ${parts[1]} (${count})`;
            container.appendChild(label);
        });
    }

    // 4. FUNGSI UTAMA: GENERATE LAPORAN
    function generate() {
        const selected = document.querySelectorAll('input[name="chk-shift"]:checked');
        if (selected.length === 0) return alert("Pilih minimal satu Shift!");

        const output = document.getElementById('main-output');
        output.innerHTML = '';

        // Buat Wrapper Kertas A4
        const page = document.createElement('div');
        page.className = 'page-container';

        // --- KOP SURAT ---
        page.innerHTML = `
            <div class="kop-header">
                <div class="logo"><img src="${LOGO_FILENAME}" alt="Logo" onerror="this.style.visibility='hidden'"></div>
                <div class="kop-text">
                    <h2>KOORDINATOR PENDIDIKAN AL-QUR’AN</h2>
                    <h3>METODE QIROATI CABANG DEMAK</h3>
                    <p>Sekretariat : Jl. Sunan Kalijaga No. 35 Betengan Bintoro Demak Hp. 0896-0898-6635</p>
                </div>
            </div>
            <div class="doc-title">
                <h1>DAFTAR HADIR PENDAMPING</h1>
                <p contenteditable="true">Klik di sini untuk mengubah Hari & Tanggal...</p>
            </div>
            <div id="table-content"></div>
            <div class="footer-note">
                Ralat Nama/ Mendaftarkan Pendamping Tambahan melalui WA ke 0896-0898-6635
            </div>
        `;

        output.appendChild(page);
        const contentArea = page.querySelector('#table-content');

        // --- LOOP PER SHIFT YANG DIPILIH ---
        selected.forEach(chk => {
            const key = chk.value;
            const [gel, sft] = key.split('-');
            
            // A. FILTER DATA BERDASARKAN SHIFT
            const shiftData = rawData.filter(d => d.key === key);

            // B. REKAP DATA (PIVOT): HITUNG JUMLAH PESERTA PER LEMBAGA
            // Object: { "TPQ Al-Falah": 5, "TPQ Nurul Huda": 10 }
            let rekapLembaga = {};
            shiftData.forEach(d => {
                let namaLembaga = d.lembaga;
                // Bersihkan nama kota jika ada (misal: "Demak - TPQ Al Falah" -> "TPQ Al Falah")
                if(namaLembaga.includes("-")) {
                    const parts = namaLembaga.split("-");
                    // Ambil bagian setelah strip pertama, gabung lagi jika ada strip lain
                    namaLembaga = parts.slice(1).join("-").trim();
                }

                if(!rekapLembaga[namaLembaga]) {
                    rekapLembaga[namaLembaga] = 0;
                }
                rekapLembaga[namaLembaga]++;
            });

            // C. RENDER TABEL HTML
            let tableRows = '';
            let no = 1;
            // Urutkan nama lembaga abjad
            Object.keys(rekapLembaga).sort().forEach(lembaga => {
                const jumlah = rekapLembaga[lembaga];
                tableRows += `
                    <tr>
                        <td class="col-no">${no++}</td>
                        <td style="padding-left:10px;">${lembaga}</td>
                        <td class="col-jml">${jumlah}</td>
                        <td class="col-pendamping">
                            Nama Terang<br><br>
                            <div class="pendamping-footer">No Hp / WA</div>
                        </td>
                        <td class="col-ttd"></td>
                    </tr>
                `;
            });

            // Tentukan Waktu Shift (Hardcode mapping sederhana)
            let waktu = "WIB";
            if(sft == '1') waktu = "07.00 WIB";
            if(sft == '2') waktu = "08.30 WIB";
            if(sft == '3') waktu = "10.00 WIB";

            const sectionHtml = `
                <div class="shift-block">
                    <div class="shift-header">Gelombang ${gel} - Shift ${sft} | ${waktu}</div>
                    <table>
                        <thead>
                            <tr>
                                <th>NO</th>
                                <th>NAMA LEMBAGA/TPQ</th>
                                <th>JML PESERTA</th>
                                <th>PENDAMPING</th>
                                <th>TTD</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                </div>
            `;
            contentArea.innerHTML += sectionHtml;
        });
    }
</script>

</body>
</html>
